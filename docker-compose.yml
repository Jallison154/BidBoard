version: '3.8'

services:
  bidboard:
    build: .
    container_name: bidboard
    ports:
      - "${PORT:-3001}:3001"
    restart: unless-stopped
    # Optional: for local/CLI deploys with a real .env file. Skipped harmlessly
    # when absent (e.g. Portainer Git-stack deploys).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
